[project]
name = "linx-game"
version = "0.1.0"
description = "灵矽语音游戏 MCP 服务"
authors = [
    { name = "spojchil", email = "108040742+spojchil@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.3.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
linx-game-probe = "linx_game.probe:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
