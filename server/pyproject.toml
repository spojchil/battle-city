[project]
name = "linx-game"
version = "0.1.0"
description = "灵矽语音游戏 MCP 服务"
authors = [
    { name = "spojchil", email = "108040742+spojchil@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
    "websockets>=17.3",
]

[project.scripts]
linx-game = "linx_game.app:main"
linx-provision = "linx_game.devtools.provision:main"
linx-game-probe = "linx_game.probe:main"
linx-vdevice = "linx_game.devtools.vdevice:main"
linx-enroll = "linx_game.devtools.enroll:main"
linx-speaker-check = "linx_game.devtools.speaker_check:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
