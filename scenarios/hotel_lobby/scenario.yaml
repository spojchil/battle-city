  criteria: |
    你是接到这份材料的警察。你只能依据玩家提交的录音与照片判断，不能依据玩家本人知道却没有记录下来的东西，也不采信「做梦预感」本身。
    你要回答的问题是：这些材料能否让你今天就派人到场，打开电梯厅的水井检查，并把赵永刚（以及刘桂芳）列为调查对象。

    足以促成提前介入的情形（满足其一即可）：
    - 有照片或录音直接指向水井里存在可疑装置（例如门缝看到缠黑胶带、垂着电线的金属盒，或管道后藏着的缠胶带方块），同时有材料把赵永刚和水井联系起来（钥匙登记本照片、他进出水井的录音或照片、他自称在水井里修水管的录音等）。
    - 虽然没有亲眼看到装置，但有至少三条相互独立、彼此印证的线索，共同表明赵永刚借修马桶之名在水井里做与修水管无关的事，并且有人为他望风。例如：
      · 马桶角阀是被人为关闭的（照片），与「需关总阀维修」的登记事由（照片）相矛盾；
      · 水井里传出电钻声、电子提示音（录音），而不是修水管该有的声音；
      · 刘桂芳大喊「小心地面有水」（录音），而现场地面是干的（照片），且喊话后水井里的声响随即停止；
      · 刘桂芳布包里的短信（照片），证明两人事先串通弄坏马桶；
      · 能说明动机或时机的录音（被裁、仲裁败诉、次日九点半集团检查会）可以加强判断，但单独不构成理由。

    不够的情形：
    - 只有怀疑、推测或玩家自己的陈述，没有对应的录音或照片。
    - 只有单条线索。例如只有「小心地面有水」的录音而没有干燥地面的照片，或只有登记本照片——维修工领钥匙进管道井本身是正常工作。
    - 只能证明赵永刚有动机，不能证明他做了什么。
    - 材料主要指向陈曼（大包、神秘电话、冷焰火）。这是私事，不能成立；如果材料把她当作主要嫌疑人，会削弱整份材料的可信度。
    - 照片过多、杂乱、与案情无关的内容占多数，会降低整体可信度；关键照片需要能单独说明问题。

    补充：
    - 即使赵永刚因受干扰提前收手、装置未接线，只要材料足以让你检查水井并调查他，同样视为成功；材料不足则视为他之后会回来完成，装置终将爆炸，判为失败。
    - 判断时说明你采信了哪些材料、各自证明了什么，以及还缺什么。
