  # 玩家
  - to: player
    at: "14:15"
    text: 手机提醒：「14:20 整理材料报警。」还剩五分钟。

judge:
  truth: |
    作案者：维修工赵永刚（安装者）与保洁刘桂芳（内应）。

    动机：赵永刚原是酒店自有维修工，干了十四年。两年前酒店工程部外包，裁员名单由值班经理周建明签字，赵永刚被裁，酒店以一份他签字的「自愿解除合同协议」为由只给了少量赔偿。他提起劳动仲裁，上个月败诉。此后他作为外包恒达物业的合同工，仍常被派回酒店维修。次日上午九点半，集团副总将在大堂召开现场检查会。

    经过：
    - 两天前赵永刚把分工写在一张烟盒纸上交给刘桂芳，字条至今夹在她放在储藏室的布包里。
    - 13:50 左右刘桂芳借打扫，关闭男卫马桶的进水角阀，使马桶不出水；13:52 发短信给赵永刚「马桶弄好了，你等电话」。
    - 约 14:02 住客王浩发现马桶不出水，到总服务台投诉；前台林晓雨用内线电话报告值班经理周建明，周建明用办公室电话叫赵永刚来修。
    - 赵永刚在门外面包车里等候，接电话后约两分钟进入大堂，到前台办公室在钥匙柜登记领取水井钥匙，事由写「男卫马桶不出水，需关总阀维修」。实际上马桶只是角阀被关，在卫生间内拧开即可，无需进入水井。
    - 赵永刚进入电梯厅暗门后的水井，在主水管背后固定一个自制定时爆炸装置（固定阶段伴有电钻声），再接线并设定定时（伴有电子提示音），定时为次日上午九点半，即集团检查会召开时。
    - 期间刘桂芳在电梯厅立「小心地滑」牌假装拖地，地面实际是干的。有人靠近时她大声提醒「小心地面有水」，提醒本身是寻常话，但水井里的赵永刚借此得知有人靠近并停手。
    - 安装完成后，赵永刚到卫生间拧开角阀，「修好」马桶，归还钥匙后离开。
    - 刘桂芳以为装置只是让总水管半夜爆裂、淹掉大堂，并不知道是炸药；但她明知是蓄意破坏，并主动配合。
    - 若赵永刚受到过多干扰，可能在接线前收手，以「总阀锈死，明天带配件再来」为由离开，未接线的装置留在原处，打算次日早上再来完成。

    装置装好后藏在水井主水管背后的阴影中，水井平时上锁，外人不易发现。本局结束时若警方没有掌握足够线索，装置将在本局之外按时爆炸。

    干扰项：住客陈曼提着大包、反复打神秘电话，提到「东西带来了」「三点一点就亮」「别让他知道」，实为准备向男友何舟求婚，包里是冷焰火、彩带、干花和戒指盒，与爆炸无关。住客王浩、前台林晓雨、值班经理周建明均不知情。

    玩家可获得的线索：
    1. 马桶角阀被人为关闭（检查马桶可见），与登记本上「需关总阀维修」的说法矛盾。
    2. 钥匙登记本：赵永刚以修马桶为由领取水井钥匙。
    3. 刘桂芳在电梯厅大喊「小心地面有水」，而「小心地滑」牌旁的地面是干的、拖把是干的；她提醒之后水井里的声响随即停止，人走后又恢复。
    4. 水井内传出的电钻声与电子提示音「嘀」，与修水管不符。
    5. 赵永刚取走钥匙后暗门没有关紧，站在暗门口能看到水井内的情形（可拍照）：地上工具包里是电工胶带、电线、电钻而无管钳和生料带；或主水管背后缠黑胶带、垂着电线的金属盒；或管道后藏着看不清的缠胶带方块。归还钥匙后暗门锁上，就看不到了。
    6. 储藏室刘桂芳布包中赵永刚手写的分工字条，证明两人事先串通、马桶是人为弄坏、刘桂芳负责在电梯厅望风；刘桂芳的提醒与水井声响的关联需要录音佐证。
    7. 赵永刚在水井中停留远长于修马桶所需，真正「修马桶」只用了约一分钟。
    8. 动机：周建明或林晓雨口中的被裁与仲裁败诉；周建明口中的次日九点半集团检查会；周建明关于「修马桶一般不需要关总阀」的说法。
    9. 刘桂芳与赵永刚私下以「永刚」「桂芳」相称的耳语交谈。
  criteria: |
    你是接到这份材料的警察。你只能依据玩家提交的录音与照片判断，不能依据玩家本人知道却没有记录下来的东西，也不采信「做梦预感」本身。
    你要回答的问题是：这些材料能否让你今天就派人到场，打开电梯厅的水井检查，并把赵永刚（以及刘桂芳）列为调查对象。

    足以促成提前介入的情形（满足其一即可）：
    - 有照片或录音直接指向水井里存在可疑装置（例如在暗门口看到并拍下缠黑胶带、垂着电线的金属盒，或管道后藏着的缠胶带方块），同时有材料把赵永刚和水井联系起来（钥匙登记本照片、他进出水井的录音或照片、他自称在水井里修水管的录音等）。
    - 虽然没有亲眼看到装置，但有至少三条相互独立、彼此印证的线索，共同表明赵永刚借修马桶之名在水井里做与修水管无关的事，并且有人为他望风。例如：
      · 马桶角阀是被人为关闭的（照片），与「需关总阀维修」的登记事由（照片）相矛盾；
      · 水井里传出电钻声、电子提示音（录音），而不是修水管该有的声音；
      · 刘桂芳大喊「小心地面有水」（录音），而现场地面是干的（照片），且喊话后水井里的声响随即停止；
      · 刘桂芳布包里赵永刚手写的分工字条（照片），证明两人事先串通弄坏马桶并安排望风；
      · 能说明动机或时机的录音（被裁、仲裁败诉、次日九点半集团检查会）可以加强判断，但单独不构成理由。

    不够的情形：
    - 只有怀疑、推测或玩家自己的陈述，没有对应的录音或照片。
    - 只有单条线索。例如只有「小心地面有水」的录音而没有干燥地面的照片，或只有登记本照片——维修工领钥匙进管道井本身是正常工作。
    - 只能证明赵永刚有动机，不能证明他做了什么。
    - 材料主要指向陈曼（大包、神秘电话、冷焰火）。这是私事，不能成立；如果材料把她当作主要嫌疑人，会削弱整份材料的可信度。
    - 照片过多、杂乱、与案情无关的内容占多数，会降低整体可信度；关键照片需要能单独说明问题。

    补充：
    - 即使赵永刚因受干扰提前收手、装置未接线，只要材料足以让你检查水井并调查他，同样视为成功；材料不足则视为他之后会回来完成，装置终将爆炸，判为失败。
    - 判断时说明你采信了哪些材料、各自证明了什么，以及还缺什么。
