# 剧本：酒店大堂
# 格式见接口约定第 1 节。坐标 (x, y)：x 为列、y 为行，左上角为 (0, 0)，一格约 1 米。

id: hotel_lobby
title: 酒店大堂
intro: |
  你叫许言，在这家酒店长租了一间客房，已经住了半年。

  午饭后你在大堂休息区的沙发上打了个盹，做了一个梦。
  梦里你就站在这个大堂。一道白光，紧接着是一声沉闷的巨响，脚下的地面猛地一震。
  落地玻璃整片碎裂，吊灯砸下来，烟尘里有人在喊，有人倒在地上。你也倒在那片烟尘里。

  你惊醒过来。墙上的钟指向下午两点整，大堂里一切如常。

  你从小就做这种梦，而且从来没有错过。没有人会因为一个梦去报警，所以你需要证据。
  你有随身带录音笔的习惯，它一直开着，会录下你听到的一切；手机可以拍照，记下你当时看到的情形。
  不过照片拍得太多太杂，反而会让整份材料显得不可信。

  大约二十分钟后（14:20），你要把录音和照片交给警方。材料要足以让警方提前介入，并让真正的嫌疑人接受调查。
duration_s: 1200
start_clock: "14:00"

