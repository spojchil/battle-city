judge:
  truth: |
    作案者：维修工赵永刚（安装者）与保洁刘桂芳（内应）。

    动机：赵永刚原是酒店自有维修工，干了十四年。两年前酒店工程部外包，裁员名单由值班经理周建明签字，赵永刚被裁，酒店以一份他签字的「自愿解除合同协议」为由只给了少量赔偿。他提起劳动仲裁，上个月败诉。此后他作为外包恒达物业的合同工，仍常被派回酒店维修。次日上午九点半，集团副总将在大堂召开现场检查会。

    经过：
    - 13:40 赵永刚发短信给刘桂芳「两点我在门口车里」。
    - 13:50 左右刘桂芳借打扫，关闭男卫马桶的进水角阀，使马桶不出水；13:52 发短信给赵永刚「马桶弄好了，你等电话」。手机留在储藏室她的布包里。
