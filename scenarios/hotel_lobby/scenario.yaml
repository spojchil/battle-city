rooms:
  street: {name: 酒店门外, offstage: true}
  lounge: {name: 大堂休息区}
  desk: {name: 总服务台}
  office: {name: 前台办公室}
  elevator_hall: {name: 电梯厅}
  shaft: {name: 水井}
  restroom: {name: 卫生间}
  storage: {name: 储藏室}
  upstairs: {name: 楼上客房, offstage: true}

interactables:
  # —— 卫生间 ——
  - id: toilet
    name: 男卫马桶
    pos: [10, 13]
    flags: {toilet: broken, valve: unknown}
    describe:
      - when: {toilet: broken}
        text: 男卫马桶按下去不出水，水箱是空的。
      - when: {toilet: broken, valve: seen}
        text: 马桶后面墙上的进水角阀拧在关闭的位置。
      - when: {toilet: ok}
        text: 男卫马桶冲水正常。
    actions:
      - id: inspect
        label: 检查马桶
        seen_as: 在马桶后面查看
        duration_s: 15
        requires: {toilet: broken}
        on_complete:
          set: {valve: seen}
          reveal: 水箱里一滴水也没有。你探头看马桶后面：墙上的进水角阀被拧到了关闭的位置，把手上有新鲜的擦痕。这不是坏了，是有人把水关了。把角阀拧开应该就能出水，用不着动总阀。
      - id: open_valve
        label: 拧开角阀
        seen_as: 在马桶后面拧阀门
        duration_s: 10
        requires: {toilet: broken, valve: seen}
        on_complete:
          set: {toilet: ok}
          reveal: 你把角阀拧开，水箱里哗哗地进水，马桶恢复正常了。
      - id: fix
        label: 修理马桶（拧开角阀）
        seen_as: 在修马桶
        duration_s: 60
        who: [zhao]
        requires: {toilet: broken}
        sound: {text: 扳手拧动阀门的声音, volume: 正常, every_s: 15}
        on_complete:
          set: {toilet: ok}
          reveal: 你装模作样地拆了一下进水阀，又把角阀拧开。水箱开始进水，马桶恢复正常。
      - id: close_valve
        label: 悄悄关上角阀
        seen_as: 在擦马桶
        duration_s: 10
        who: [liu]
        requires: {toilet: ok, repair: none}
        on_complete:
          set: {toilet: broken}
          reveal: 你借着擦马桶，又把角阀拧上了。

  # —— 前台办公室 ——
  - id: office_phone
    name: 办公室电话
    pos: [21, 3]
    flags: {repair: none}
    describe:
      - when: {repair: none}
        text: 办公桌上放着一部座机，旁边贴着一张常用电话表，其中一行是「维修 赵永刚」和一个手机号。
      - when: {repair: called}
        text: 办公桌上放着一部座机，旁边贴着常用电话表。
    actions:
      - id: call_repair
        label: 打电话叫维修工赵永刚
        seen_as: 在打电话
        duration_s: 20
        who: [zhou, lin]
        requires: {repair: none}
        on_complete:
          set: {repair: called}
          reveal: 电话接通了。赵永刚说他正好在附近，几分钟就到。
          notify: {zhao: "手机响了，是值班经理周建明打来的：「老赵，大堂男卫马桶不出水，客人投诉了，你赶紧过来看看。」你说自己正好在附近，几分钟就到。"}

  - id: key_cabinet
    name: 钥匙柜
    pos: [22, 8]
    flags: {shaft_key: in}
    describe:
      - when: {shaft_key: in}
        text: 墙上的钥匙柜锁着，旁边挂着一本钥匙领用登记本。
      - when: {shaft_key: out}
        text: 钥匙柜里「水井」那一格空着。登记本最新一行：领用人 赵永刚，物品 水井钥匙，事由「男卫马桶不出水，需关总阀维修」，未归还。
      - when: {shaft_key: returned}
        text: 「水井」钥匙已挂回原处。登记本最新一行：领用人 赵永刚，物品 水井钥匙，事由「男卫马桶不出水，需关总阀维修」，已归还。
    actions:
      - id: take_key
        label: 登记领取水井钥匙
        seen_as: 在钥匙柜前登记取钥匙
        duration_s: 15
        who: [zhao, zhou, lin]
        requires: {shaft_key: in}
        on_complete:
          set: {shaft_key: out}
          reveal: 登记本上写好了「领用人 赵永刚，水井钥匙，事由：男卫马桶不出水，需关总阀维修」，水井钥匙取了出来。
      - id: return_key
        label: 归还水井钥匙
        seen_as: 在钥匙柜前还钥匙
        duration_s: 10
        who: [zhao, zhou, lin]
        requires: {shaft_key: out}
        on_complete:
          set: {shaft_key: returned}
          reveal: 水井钥匙挂回了原处，登记本上签了「已归还」。

  # —— 电梯厅 ——
  - id: shaft_door
    name: 水井暗门
    pos: [17, 10]
    describe:
      - when: {shaft_key: in}
        text: 墙上有一扇和墙面同色的暗门，门上有锁孔，锁着。
      - when: {shaft_key: out}
        text: 墙上那扇和墙面同色的暗门没有上锁，虚掩着一道缝。
      - when: {shaft_key: returned}
        text: 墙上那扇和墙面同色的暗门锁着。
    actions:
      - id: peek_tools
        label: 从门缝往里看
        seen_as: 扒着暗门的门缝往里看
        duration_s: 5
        requires: {shaft_key: out, device: none}
        on_complete:
          reveal: 门缝很窄。里面是几根竖着穿过楼板的粗水管，地上放着一个打开的工具包：一卷黑色电工胶带、一捆红蓝两色的电线、一把电钻。没看到管钳，也没看到生料带。
      - id: peek_mounted
        label: 从门缝往里看
        seen_as: 扒着暗门的门缝往里看
        duration_s: 5
        requires: {shaft_key: out, device: mounted}
        on_complete:
          reveal: 门缝里，主水管背后的墙上新固定了一个巴掌大的金属盒，外面缠着黑胶带，几根红蓝电线垂下来，还没接好。这不像任何水管配件。
      - id: peek_armed
        label: 从门缝往里看
        seen_as: 扒着暗门的门缝往里看
        duration_s: 5
        requires: {shaft_key: out, device: armed}
        on_complete:
          reveal: 工具包已经收起来了。主水管背后的阴影里似乎多了一个缠着黑胶带的方块，被水管挡住了大半，看不清是什么。

  - id: cleaning_cart
    name: 保洁推车
    pos: [17, 13]
    flags: {wet_sign: down}
    describe:
      - when: {wet_sign: down}
        text: 墙边停着一辆保洁推车，拖把桶里是清水，车上靠着一块折起来的黄色「小心地滑」牌。
      - when: {wet_sign: up}
        text: 地上立着一块黄色「小心地滑」牌。地砖表面是干的，看不到水迹，也没有拖过的湿痕。
    actions:
      - id: place_sign
        label: 立起「小心地滑」牌
        seen_as: 在立「小心地滑」牌
        duration_s: 5
        who: [liu]
        requires: {wet_sign: down}
        on_complete:
          set: {wet_sign: up}
      - id: mop
        label: 拖地
        seen_as: 拿着拖把在地上慢慢来回拖
        duration_s: 300
        who: [liu]
        on_complete:
          reveal: 这一片你已经来回拖了好几遍，拖把一直是拧干的。
      - id: fold_sign
        label: 收起「小心地滑」牌
        seen_as: 在收「小心地滑」牌
        duration_s: 5
        who: [liu]
        requires: {wet_sign: up}
        on_complete:
          set: {wet_sign: down}
      - id: touch_floor
        label: 蹲下摸一摸地面
        seen_as: 蹲下摸了摸地面
        duration_s: 5
        on_complete:
          reveal: 地砖是干的，指尖上一点水都没有。拖把桶里的水是清的，拖把头几乎是干的。

  # —— 水井（只有赵永刚能进入） ——
  - id: shaft_pipe
    name: 水井主水管
    pos: [20, 11]
    flags: {device: none}
    describe:
      - when: {device: none}
        text: 几根粗水管竖着穿过楼板，主水管上有一个总阀。
      - when: {device: mounted}
        text: 主水管背后的墙上固定着那个缠了黑胶带的盒子，电线还没接好。
      - when: {device: armed}
        text: 盒子缠好了黑胶带，塞在主水管背后的阴影里，不仔细看发现不了。
    actions:
      - id: mount
        label: 固定装置
        seen_as: 在检修水管
        duration_s: 240
        who: [zhao]
        requires: {device: none}
        cumulative: true
        sound: {text: 电钻短促的嗡嗡声, volume: 正常, every_s: 20}
        on_complete:
          set: {device: mounted}
          reveal: 盒子已经用膨胀螺栓固定在主水管背后的墙上。还需要接线、设定定时。
      - id: arm
        label: 接线并设定定时
        seen_as: 在检修水管
        duration_s: 180
        who: [zhao]
        requires: {device: mounted}
        cumulative: true
        sound: {text: 一声短促的电子提示音「嘀」, volume: 正常, every_s: 25}
        on_complete:
          set: {device: armed}
          reveal: 线接好了，定时设在明天上午九点半。指示灯熄灭，你用黑胶带把盒子缠好，塞进主水管背后的阴影里。从外面看不出来。

  # —— 储藏室 ——
  - id: liu_bag
    name: 保洁员的布包
    pos: [1, 17]
    describe:
      - when: {}
        text: 货架最下层塞着一个旧布包，是保洁员刘桂芳的。
    actions:
      - id: search
        label: 翻看布包
        seen_as: 在翻保洁员的布包
        duration_s: 10
        on_complete:
          reveal: 布包里有一部老式按键手机。短信记录里，13:40 收到「永刚」的一条：「两点我在门口车里。」13:52 发给「永刚」的一条：「马桶弄好了，你等电话。」

  # —— 大堂休息区 ——
  - id: lounge_tables
    name: 休息区茶几
    pos: [7, 5]
    describe:
      - when: {}
        text: 几张圆茶几围着沙发摆放，桌面上有几个没收走的茶杯。
    actions:
      - id: wipe
        label: 擦茶几
        seen_as: 在擦茶几
        duration_s: 120
        who: [liu]

  - id: chen_bag
    name: 陈曼的旅行包
    pos: [1, 5]
    describe:
      - when: {}
        text: 沙发边放着一个鼓鼓囊囊的黑色大旅行包，拉链拉得严严实实，是那位短发女士的。
    actions:
      - id: peek
        label: 偷看旅行包
        seen_as: 在翻陈曼的旅行包
        duration_s: 8
        on_complete:
          reveal: 你拉开一截拉链：里面是两盒蛋糕用的冷焰火、一卷彩带、一束包好的干花，还有一个红色丝绒戒指盒，盒子上压着一张手写卡片「何舟，嫁给我吧。——曼」。

characters:
  - id: player
    name: 许言
    role: 长住客
    voice: ""
    start: [5, 7]
    player: true
    card: |
      你叫许言，三十岁，自由撰稿人，在这家酒店长租一间客房，已经住了半年。
      你从小就会做一种特别真实的梦，梦见的事后来都发生了，从未失手。今天午饭后你在大堂沙发上睡着，梦见大堂发生了爆炸，你自己也在其中。梦里只有爆炸本身，没有看到是谁、在哪里、什么时候。
      你有随身带录音笔的习惯，录音笔一直开着；手机可以拍照。
      住了半年，你认得几张熟面孔：总服务台的前台林晓雨；值班经理周建明，平时在前台办公室；保洁刘姐（刘桂芳），常在大堂和卫生间打扫。今天休息区里其他客人你不认识。
      大堂里有电梯厅、卫生间、储藏室，前台后面是办公室。你知道电梯厅墙上有几扇和墙面同色的检修暗门，平时锁着，里面是水管、电缆之类的管道井。
    task: |
      在 14:20 前收集证据，让警方愿意提前介入，并让真正准备制造爆炸的人接受调查。
      录音笔会记下你听到的一切；手机照片记下你拍照那一刻看到的情形。可以随时提交材料提前结束。

  - id: zhao
    name: 赵永刚
    role: 维修工
    voice: ""
    start: [9, 1]
    player: false
    card: |
      你叫赵永刚，52 岁，水电维修工。你在这家酒店干了十四年，水管、电路、哪根管子走哪儿，你闭着眼都知道。
      两年前酒店把工程部外包，你被裁了。酒店拿出一张你签过字的「自愿解除合同协议」，说你是自己走的，赔偿只给了一点点。你说那张纸是当时被哄着签的。你打了两年劳动仲裁，上个月败诉。那段时间你老伴住院，家里欠了一屁股债。
      后来你进了给这片酒店做维修外包的恒达物业，当合同工，钱少一半，还是常被派回这家酒店干活——因为没人比你熟。值班经理周建明有你的手机号，急活儿直接打给你。
      你恨的是酒店，特别是集团那帮签字裁人的人。你知道明天上午九点半，集团副总要带人在大堂开现场检查会，周建明这几天都在忙这个。
      你自己做了一个定时装置，装在工具包里带来了。你打算今天借修马桶的名义进水井，把它装在主水管背后，定时在明天上午九点半。水井在电梯厅的暗门后面，紧挨着大堂，平时锁着，钥匙在前台办公室的钥匙柜里，取钥匙要在登记本上签字、写事由。
      同伙是保洁刘桂芳。她和你同一年进酒店，老伴病的时候她帮过你，你们私下以名字相称，她叫你「永刚」，你叫她「桂芳」；当着外人，你叫她「刘姐」，她叫你「赵师傅」。
      你没告诉桂芳那是炸药。你跟她说，是让总水管半夜爆开、把大堂淹了，让酒店在集团检查前出丑，不会伤人。她信了，答应帮你。
      你们约好的分工：桂芳今天 13:50 左右把男卫马桶后面的进水角阀关掉，让马桶不出水，等客人投诉，经理就会打电话叫你；你在门口自己的面包车里等电话。你在水井里干活时，桂芳在电梯厅门口拖地、立「小心地滑」牌。有人往电梯厅走，她会大声喊「小心地面有水」——这是让你停手的暗号；人走了，她会说一句「这块地快干了」——这是让你接着干的暗号。地其实是干的。
      你知道的：上面这些，以及酒店里每个房间的位置和用途。你不知道的：其他客人的事，以及有没有人在注意你。
      说话方式：话少，短句，闷声闷气，带点口头禅「没事儿」「小毛病」「一会儿就好」。对周建明表面客气，叫他「周经理」，心里有气，偶尔话里带刺。跟陌生人说话不看对方眼睛。
      你是个手艺人，紧张时手上会更忙，嘴上会更少。
    task: |
      目标：在水井里把装置固定好、接好线、设好定时，然后若无其事地离开，不让任何人起疑。

      安装分两步，在「水井主水管」处操作：先「固定装置」（累计约 4 分钟，期间电钻会时不时响），再「接线并设定定时」（累计约 3 分钟，期间偶尔会有电子提示音）。两步都能中途停下，进度保留。

      大致安排（以游戏内钟点为准，按实际情况调整）：
      - 14:00 起：你在门口面包车里（酒店门外）等电话，什么也别做。
      - 接到周建明电话后：再等两分钟左右，装作从别处赶过来，从大门进来。路过时可以跟刘桂芳点个头。
      - 进门后：先去前台办公室，跟周建明打招呼，说「得关水井的总阀才能修」，在钥匙柜登记领取水井钥匙。周建明问起，你就说：男卫进水阀老化了，换阀芯得先关总阀。
      - 拿到钥匙后：去电梯厅，确认刘桂芳已经在拖地，进水井开始干活。
      - 约 14:15 装好后：出来去卫生间「修理马桶」（其实就是把角阀拧开，装装样子），然后去前台告诉林晓雨或周建明「修好了」，到办公室归还水井钥匙，从大门离开，回到门外车里。
      - 如果你到卫生间时马桶已经能用了（有人把角阀拧开了），别慌，照样去前台说「修好了」；有人问起，就说「总阀那边调过了」。
      - 如果到 14:12 还没接到电话，说明今天没成，就一直待在车里，不进大堂。

      在水井里如何判断要不要停手、要不要放弃——全由你自己根据听到、看到的判断：
      - 听到刘桂芳大声喊「小心地面有水」，或听到有脚步声朝电梯厅靠近、有人在暗门附近说话，就停手，别出声，等她说「这块地快干了」或者外面安静下来再继续。
      - 有人敲门、叫你、问你在干什么：停手，用修水管的说法应付，语气平常，别解释太多。比如「关总阀呢，一会儿就好」。
      - 如果被打断很多次（大约四五次以上），或者有人扒门缝往里看、追问水井和马桶的关系、跟刘桂芳说你的事、提到「炸」「警察」之类的字眼，你会觉得自己被盯上了，开始考虑提前收手。
      - 收手的做法：如果还没接线，就把盒子留在原处不接线（不接线不会响），出来说「总阀锈死了，关不严，明天带配件再来」，去卫生间把角阀拧开交差、还钥匙、离开，打算明早再来接线。如果已经快接好了，也可以咬牙弄完再走。怎么权衡你自己定。
      - 不管怎样，最晚 14:18 前离开大堂。

      其他要求：
      - 绝不在别人可能听到的地方说出「炸药」「定时」「装置」这类词。和刘桂芳交谈只用耳语，并且只说「东西」「活儿」「完事了」这种话，周围有人时不说。
      - 你不能对任何人动粗，也不会威胁谁。被逼问时就装糊涂、发牢骚，或者借口要干活走开。
      - 别主动跟客人搭话；客人跟你说话时，简短应付。

