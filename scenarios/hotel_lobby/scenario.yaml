judge:
  truth: |
    唯一的预谋者是维修工赵永刚，唯一的预谋是炸弹；其余都是当天临时发生的事。

    动机：赵永刚原是酒店自有维修工，干了十四年。两年前酒店工程部外包，裁员名单由值班经理周建明签字，赵永刚被裁，酒店以一份他签字的「自愿解除合同协议」为由只给了少量赔偿。他提起劳动仲裁，上个月败诉。此后他作为外包恒达物业的合同工，仍常被派回酒店维修。次日上午九点半，集团副总将在大堂召开现场检查会。

    预谋：赵永刚自制了一个定时爆炸装置，放在工具包里已有些天，打算装进电梯厅暗门后的水井（紧挨大堂）。水井平时上锁，钥匙在前台办公室的钥匙柜里，领用须登记事由。他一直在等一个能名正言顺进入水井的机会。

    经过：
    - 男卫马桶的水箱进水阀老化卡死，马桶不出水。这是自然故障，无人动手。马桶后面的角阀完好、处于开启状态，修理时只需关上角阀更换进水阀，在卫生间内即可完成，无需关闭水井总阀。
    - 约 14:02 住客王浩如厕时发现马桶冲不了水，到总服务台投诉；前台林晓雨用内线电话报告值班经理周建明，周建明打电话叫赵永刚来修。
    - 赵永刚当时正好在酒店门外自己的车里。接到电话后，他临时决定借这次维修进入水井：进门后到前台办公室，在钥匙柜登记领取水井钥匙，事由写「男卫马桶不出水，需关总阀维修」。
    - 水井暗门的锁发涩，钥匙取走后门关不严，留有一道缝，站在门口可看到水井内部。
    - 赵永刚临时压低声音托老乡、保洁刘桂芳在电梯厅门口帮他看着，有人过来就提醒一声，理由是门关不严、怕客人乱闯。刘桂芳不知道装置的事，出于人情答应，在电梯厅立起「小心地滑」牌，用拧干的拖把做样子，地面实际是干的；有人走近时她大声招呼「小心地面有水」，赵永刚听到即停手。
    - 赵永刚在水井主水管背后先固定装置（伴有电钻声），再接线并设定定时（伴有电子提示音「嘀」），定时为次日上午九点半，即集团检查会召开时。他始终没有关闭总阀，总阀手柄一直与水管平行（开启）。
    - 安装完成后，赵永刚到卫生间更换进水阀（约一分钟），马桶恢复正常，归还钥匙后离开。
    - 若受到过多干扰，他可能在接线前收手，以「总阀锈死，明天带配件再来」为由离开，未接线的装置留在原处，打算次日早上再来完成。

    装置装好后藏在水井主水管背后的阴影中，水井平时上锁，外人不易发现。本局结束时若警方没有掌握足够线索，装置将在本局之外按时爆炸。

    刘桂芳不是共犯：她只是应熟人之托看门，事后可能起疑，但不知道真相。住客陈曼提着大包、反复打神秘电话，提到「东西带来了」「三点一点就亮」「别让他知道」，实为准备向男友何舟求婚，包里是冷焰火、彩带、干花和戒指盒，与爆炸无关。住客王浩、前台林晓雨、值班经理周建明均不知情。

    玩家可获得的线索：
    1. 赵永刚托刘桂芳看门的那句话（他压低声音说，需在近处才听得清）；或事后向刘桂芳询问，她会说出是谁、怎么托的。
    2. 钥匙登记本：赵永刚以「男卫马桶不出水，需关总阀维修」为由领取水井钥匙。
    3. 马桶的实际状态：按冲水键不出水；掀开水箱盖可见浮杆卡在最高处、水箱无水，马桶后面有一个开启状态的角阀。与「需关总阀」的事由可相互比对；周建明会说出修马桶一般只需关角阀、很少需要关总阀，总阀手柄平行为开、垂直为关。
    4. 刘桂芳在电梯厅大声说「小心地面有水」，而「小心地滑」牌旁的地面是干的、拖把是干的；她说完后水井里的声响随即停止。
    5. 水井内传出的电钻声与电子提示音「嘀」。
    6. 赵永刚取走钥匙后暗门虚掩，站在暗门口能看到并拍下水井内的情形：总阀手柄与水管平行；地上工具包里是电工胶带、电线、电钻而无管钳和生料带；或主水管背后缠黑胶带、垂着未接线头的金属盒；或管道后缠黑胶带、看不清细节的方块。归还钥匙后暗门锁上，就看不到了。
    7. 赵永刚在水井中停留远长于修马桶所需，真正在卫生间修马桶只用了约一分钟。
    8. 动机与时机：周建明或林晓雨口中的被裁与仲裁败诉；周建明口中的次日九点半集团检查会。
  criteria: |
    你是接到这份材料的警察。你只能依据玩家提交的录音与照片判断，不能依据玩家本人知道却没有记录下来的东西，也不采信「做梦预感」本身。
    你要回答的问题是：这些材料能否让你今天就派人到场，打开电梯厅的水井检查，并把赵永刚列为调查对象。

    足以促成提前介入的情形（满足其一即可）：
    - 有照片或录音直接指向水井里存在可疑物品（例如在暗门口拍到主水管背后缠黑胶带、垂着电线的金属盒，或管道后缠胶带的方块），同时有材料把赵永刚和水井联系起来（钥匙登记本照片、他进出水井的录音或照片、他自称在水井里修水管的录音等）。
    - 虽然没有拍到可疑物品，但有至少三条相互独立、彼此印证的线索，共同表明赵永刚借修马桶之名在水井里做与修水管无关的事，并且刻意避人。例如：
      · 登记事由「需关总阀维修」（照片），与马桶实际状态（照片：角阀开启、水箱浮杆卡住）或总阀手柄始终开启（照片）不符；周建明关于修马桶一般无需关总阀的说法（录音）可以加强这一点；
      · 水井里传出电钻声、电子提示音（录音），而不是修水管该有的声音；
      · 赵永刚托人看门、有人来就提醒的那句话（录音），或刘桂芳事后说出被托看门（录音）；
      · 刘桂芳大声提醒「小心地面有水」（录音），而现场地面是干的（照片），且提醒后水井里的声响随即停止；
      · 工具包里只有电工胶带、电线、电钻而没有水管工具（照片）；
      · 能说明动机或时机的录音（被裁、仲裁败诉、次日九点半集团检查会）可以加强判断，但单独不构成理由。

    不够的情形：
    - 只有怀疑、推测或玩家自己的陈述，没有对应的录音或照片。
    - 只有单条线索。例如只有「小心地面有水」的录音而没有干燥地面的照片，或只有登记本照片——维修工领钥匙进管道井本身是正常工作。
    - 只能证明赵永刚有动机，不能证明他做了什么。
    - 材料主要指向陈曼（大包、神秘电话、冷焰火）。这是私事，不能成立；如果材料把她当作主要嫌疑人，会削弱整份材料的可信度。
    - 材料把刘桂芳当作同谋。她只是应熟人之托看门；这本身不削弱对赵永刚的指证，但若材料只指向她而未指向赵永刚，不足以介入。
    - 照片过多、杂乱、与案情无关的内容占多数，会降低整体可信度；关键照片需要能单独说明问题。

    补充：
    - 即使赵永刚因受干扰提前收手、装置未接线，只要材料足以让你检查水井并调查他，同样视为成功；材料不足则视为他之后会回来完成，装置终将爆炸，判为失败。
    - 判断时说明你采信了哪些材料、各自证明了什么，以及还缺什么。
